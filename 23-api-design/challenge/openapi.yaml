#   - add the Problem schema (RFC 9457) and use it, via $ref, for EVERY 4xx response
#     with media type application/problem+json (also the missing ones on projects)
#   - add the task operations: listProjectTasks, createTask, getTask, updateTask, deleteTask
#   - add the task schemas: Task, NewTask, TaskPatch, TaskList (+ anything you want to share)
