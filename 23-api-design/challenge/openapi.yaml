openapi: 3.1.0
info:
  title: WinterLearning Tasks API
  version: 1.0.0
  summary: Projects and the tasks inside them.
servers:
  - url: http://localhost:3000
    description: Local development

paths:
  /v1/projects:
    get:
      operationId: listProjects
      summary: List projects, oldest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        # TODO: 400
    post:
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewProject"
      responses:
        "201":
          description: Created
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        # TODO: 400

  /v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Get one project
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        # TODO: 404

  # TODO: /v1/projects/{projectId}/tasks  (get: listProjectTasks, post: createTask)
  # TODO: /v1/tasks/{taskId}              (get: getTask, patch: updateTask, delete: deleteTask)

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `page.nextCursor`.
      schema:
        type: string

  headers:
    Location:
      description: URL of the created resource.
      schema:
        type: string

  schemas:
    Project:
      type: object
      additionalProperties: false
      required: [id, name, description, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        createdAt:
          type: string
          format: date-time

    NewProject:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000

    ProjectList:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        page:
          $ref: "#/components/schemas/PageInfo"

    PageInfo:
      type: object
      additionalProperties: false
      required: [limit, nextCursor]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        nextCursor:
          description: Pass as `?cursor=` to get the next page; `null` on the last page.
          type: [string, "null"]

    # TODO: TaskStatus, TaskPriority, Task, NewTask, TaskPatch, TaskList, Problem
