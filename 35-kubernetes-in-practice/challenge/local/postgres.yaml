# LOCAL ONLY: stands in for the managed Postgres that staging/production use.
# Not part of the incident; you don't need to change anything here.
# Apply AFTER broken/ (it needs the kudos namespace): kubectl apply -f broken/ && kubectl apply -f local/
apiVersion: v1
kind: Secret
metadata:
  name: postgres-admin
  namespace: kudos
type: Opaque
stringData:
  POSTGRES_USER: "kudos"
  POSTGRES_DB: "kudos"
  # must equal the DB password in the kudos-db Secret (as it would with a managed DB)
  POSTGRES_PASSWORD: "local-dev-only-not-a-real-secret"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kudos
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: kudos
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-admin
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
