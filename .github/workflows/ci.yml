# Runs the acceptance tests for every module a pull request touches.
#
# Starters on `main` are *supposed* to fail, so CI only runs on PRs (your work)
# and on manual dispatch (e.g. run "all" against the `solutions` branch).
name: module-ci

on:
  pull_request:
  workflow_dispatch:
    inputs:
      modules:
        description: 'Module ids or folders, space-separated (e.g. "05 13"), or "all"'
        required: true
        default: all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      any: ${{ steps.find.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: find
        name: Find modules to test
        env:
          INPUT_MODULES: ${{ github.event.inputs.modules }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module -e '
            import { execSync } from "node:child_process";
            import { existsSync, readdirSync, readFileSync, appendFileSync } from "node:fs";
            const all = readdirSync(".", { withFileTypes: true })
              .filter(d => d.isDirectory() && existsSync(`${d.name}/module.json`) && existsSync(`${d.name}/challenge/package.json`))
              .map(d => d.name);
            let dirs;
            const input = (process.env.INPUT_MODULES || "").trim();
            if (input) {
              dirs = input === "all" ? all : all.filter(d => input.split(/\s+/).some(k => d === k || d.startsWith(k + "-")));
            } else {
              const changed = execSync(`git diff --name-only ${process.env.BASE_SHA}...${process.env.HEAD_SHA}`).toString().split("\n");
              const top = new Set(changed.filter(Boolean).map(p => p.split("/")[0]));
              dirs = all.filter(d => top.has(d));
            }
            const include = dirs.map(dir => {
              const meta = JSON.parse(readFileSync(`${dir}/module.json`, "utf8"));
              return { dir, kafka: (meta.services || []).includes("kafka") };
            });
            console.log("modules:", dirs.join(", ") || "(none)");
            appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\nany=${include.length > 0}\n`);
          '

  test:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    name: ${{ matrix.dir }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wl
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: ${{ matrix.dir }}/challenge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start Kafka
        if: matrix.kafka
        run: |
          docker run -d --name kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=true \
            apache/kafka:3.9.0
          for i in $(seq 1 60); do
            docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 && break
            sleep 2
          done
          echo "KAFKA_BROKERS=localhost:9092" >> "$GITHUB_ENV"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run --if-present typecheck

      - name: Test
        run: npm test
