# Example: nginx as an L7 load balancer in front of two aggregator instances.
# Not used by the tests. Run two instances (PORT=3000 and PORT=3001 npm run dev),
# then e.g.:  docker run --rm --network host -v "$PWD/deploy/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:alpine
# and point k6 at http://localhost:8080.

worker_processes auto;
events { worker_connections 4096; }

http {
  upstream aggregator {
    # least_conn: send each request to the instance with the fewest active requests.
    # Better than round-robin when request durations vary (they do: retries, timeouts).
    least_conn;

    # Passive health checks: after 3 failures within 10s, take the instance out for 10s.
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;

    # Reuse connections to the instances instead of a new TCP handshake per request.
    keepalive 64;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://aggregator;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Timeouts everywhere, including at the edge. The app's own budget is ~1s.
      proxy_connect_timeout 1s;
      proxy_read_timeout 3s;
      proxy_send_timeout 3s;

      # Retry on another instance only for connection errors and only for
      # idempotent requests (nginx's default). Never retry on timeout: the first
      # instance may still be doing the work, so a retry doubles the load.
      proxy_next_upstream error;
      proxy_next_upstream_tries 2;
    }

    location = /health {
      proxy_pass http://aggregator;
      access_log off;
    }
  }
}
